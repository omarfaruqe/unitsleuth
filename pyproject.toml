[project]
name = "unitsleuth"
version = "0.1.0"
description = "Detect mixed measurement units in unlabeled numeric columns from the numbers alone."
readme = "README.md"
license = "MIT"
authors = [{ name = "Md Omar Faruqe", email = "faruqe@ru.ac.bd" }]
requires-python = ">=3.10"
keywords = ["data-quality", "units", "measurement", "mixture-model", "data-cleaning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/omarfaruqe/unitsleuth"
Issues = "https://github.com/omarfaruqe/unitsleuth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
python_version = "3.10"
